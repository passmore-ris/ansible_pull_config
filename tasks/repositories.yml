# Debian repositories
- name: Set Debian repositories to Yandex mirrors
  ansible.builtin.copy:
    src: files/repositories/debian
    dest: /etc/apt/sources.list
    mode: '0644'
  when: ansible_facts['distribution'] == 'Debian'

# Rocky Repositories
- name: Set Rocky Linux repositories to Yandex mirrors
  ansible.builtin.unarchive:
    src: files/repositories/rocky-linux-yandex-mirrors-main.tar.gz
    dest: /etc/yum.repos.d/
    mode: '0644'
    extra_opts:
      - '--strip-components=1'
  when: ansible_facts['distribution'] == 'Rocky'

- name: Update cache
  ansible.builtin.package:
    update_cache: true
