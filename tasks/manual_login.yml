- name: Turn on manual login for Linux Mint workstations
  ansible.builtin.copy:
    src: files/lightdm.conf
    dest: /etc/lightdm/lightdm.conf
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts['distribution'] == 'Linux Mint'

- name: Turn on manual login for MOS workstations
  ansible.builtin.copy:
    src: files/uid.conf
    dest: /etc/sddm.conf.d/uid.conf
    owner: root
    group: root
    mode: '0664'
  when: ansible_facts['distribution'] == 'MOS'

- name: Turn on manual login for Debian workstations
  ansible.builtin.lineinfile:
    path: /etc/gdm3/greeter.dconf-defaults
    regexp: '^#?disable-user-list=false'
    line: 'disable-user-list=true'
  when: ansible_facts['distribution'] == 'Debian'

- name: Turn on manual login for RedHat Workstations
  when: ansible_os_family == 'RedHat'
  block:
    - name: Create /etc/dconf/profile/gdm file
      ansible.builtin.file:
        path: /etc/dconf/profile/gdm
        state: touch
        owner: root
        group: root
        mode: '0644'
    - name: Add content to /etc/dconf/profile/gdm
      ansible.builtin.blockinfile:
        path: /etc/dconf/profile/gdm
        block: |
          user-db:user
          system-db:gdm
          file-db:/usr/share/gdm/greeter-dconf-defaults

    - name: Create /etc/dconf/db/gdm.d/00-login-screen file
      ansible.builtin.file:
        path: /etc/dconf/db/gdm.d/00-login-screen
        state: touch
        owner: root
        group: root
        mode: '0644'

    - name: Add content to /etc/dconf/db/gdm.d/00-login-screen
      ansible.builtin.blockinfile:
        path: /etc/dconf/db/gdm.d/00-login-screen
        block: |
          [org/gnome/login-screen]
          disable-user-list=true
      notify: Update dconf database

    - name: Update dconf database
      ansible.builtin.command: dconf
      changed_when: false
