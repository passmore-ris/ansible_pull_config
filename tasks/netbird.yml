- name: Ensure system-wide autostart directory exists
  ansible.builtin.file:
    path: /etc/xdg/autostart
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure system-wide Netbird UI autostart
  ansible.builtin.copy:
    dest: /etc/xdg/autostart/netbird-ui.desktop
    owner: root
    group: root
    mode: '0644'
    content: |
      [Desktop Entry]
      Type=Application
      Name=Netbird UI
      Comment=Netbird Client Interface
      Exec=netbird-ui
      Terminal=false
      X-GNOME-Autostart-enabled=true

- name: Update dconf database
  ansible.builtin.command: dconf update
  changed_when: false
