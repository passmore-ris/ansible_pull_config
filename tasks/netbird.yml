- name: Ensure dconf local database directory exists
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Enable AppIndicator extension in dconf local database
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/00-extensions
    content: |
      [org/gnome/shell]
      enabled-extensions=['ubuntu-appindicators@ubuntu.com']
    owner: root
    group: root
    mode: '0644'


