[domain/ipa.rischool.ru]

id_provider = ipa
ipa_server = _srv_, dc1.ipa.rischool.ru
ipa_domain = ipa.rischool.ru
ipa_hostname = debian-staff.ipa.rischool.ru
auth_provider = ipa
chpass_provider = ipa
access_provider = ipa
cache_credentials = True
ldap_tls_cacert = /etc/ipa/ca.crt
krb5_store_password_if_offline = True
[sssd]
services = nss, pam, ssh, sudo, autofs

domains = ipa.rischool.ru
[nss]
homedir_substring = /home

