- name: Install depedencies for debian-based systems
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Add Turbowarp repository
  ansible.builtin.deb822_repository:
    name: turbowarp
    types: deb
    uris: https://releases.turbowarp.org/deb
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://desktop.turbowarp.org/release-signing-key.gpg

- name: Add Sublime repository
  ansible.builtin.deb822_repository:
    name: sublime
    types: deb
    uris: https://download.sublimetext.com
    suites: apt/stable/
    signed_by: https://download.sublimetext.com/sublimehq-pub.gpg

- name: Install apt packages
  ansible.builtin.package:
    name:
      - turbowarp-desktop
      - blender
      - snapd
      - inkscape
      - geany
      - thonny # Workbench.py must be changed. See 'thonny.yml'
      - gimp
      - audacity
      - dia
      - sqlitebrowser
      - sublime-text
      - tmux
      - libreoffice-l10n-ru # Russian language pack for LibreOffice

