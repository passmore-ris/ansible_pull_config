- name: Install depedencies for debian-based systems
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
      - ca-certificates
      - flatpak
    update_cache: true
  when: ansible_os_family == 'Debian'

# Install packages common to pupils and staff
# OnlyOffice:
- name: Download OnlyOffice GPG key from Ubuntu keyserver
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0xCB2DE8E5"
    dest: /usr/share/keyrings/onlyoffice.asc
    owner: root
    group: root
    mode: '0644'

- name: Add OnlyOffice DEB822 repository
  ansible.builtin.deb822_repository:
    name: onlyoffice
    types: deb
    uris: https://download.onlyoffice.com/repo/debian
    suites: squeeze
    components: main
    signed_by: /usr/share/keyrings/onlyoffice.asc

- name: Install apt packages for all workstations
  ansible.builtin.apt:
    name:
      - onlyoffice-desktopeditors
    update_cache: true
    state: present

# Install packages for pupil workstations

- name: Install packages for pupil workstations
  when: ansible_local.workstation.role.name | default('pupil') == 'pupil'
  block:
    - name: Add Sublime repository
      ansible.builtin.deb822_repository:
        name: sublime
        types: deb
        uris: https://download.sublimetext.com
        suites: apt/stable/
        signed_by: https://download.sublimetext.com/sublimehq-pub.gpg
      when: ansible_os_family == 'Debian'

    - name: Install apt packages
      ansible.builtin.package:
        name:
          - blender
          - inkscape
          - geany
          - thonny # Workbench.py must be changed. See 'thonny.yml'
          - gimp
          - audacity
          - dia
          - sqlitebrowser
          - sublime-text
          - tmux
          - libreoffice-l10n-ru # Russian language pack for LibreOffice
        update_cache: true

# Install packages for staff workstations
- name: Install packages for staff workstations
  when: ansible_local.workstation.role.name | default('pupil') == 'staff'
  block:
    - name: Add Google Chrome deb repository
      ansible.builtin.deb822_repository:
        name: google-chrome
        types: deb
        uris: https://dl.google.com/linux/chrome-stable/deb/
        suites: stable
        components: main
        architectures: amd64
        signed_by: https://dl.google.com/linux/linux_signing_key.pub
      when: ansible_os_family == 'Debian'

    - name: Add Google Chrome yum repository
      ansible.builtin.yum_repository:
        name: google-chrome
        description: Google Chrome Repository
        baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
        gpgcheck: true
        gpgkey: https://dl.google.com/linux/linux_signing_key.pub
        enabled: true
      when: ansible_os_family == 'RedHat'

    - name: Install general packages
      ansible.builtin.package:
        name:
          - google-chrome-stable
          - vlc
        update_cache: true

    - name: Install apt-specific packages
      ansible.builtin.apt:
        name:
          - libreoffice-l10n-ru # Russian language pack for LibreOffice
          - errands
          - okular
        state: present
      when: ansible_os_family == 'Debian'

    - name: Install Obsidian via flathub
      community.general.flatpak:
        name:
          - md.obsidian.Obsidian
        remote: flathub
        state: present

