- name: Install autofs and nfs-common with apt
  ansible.builtin.apt:
    name:
      - autofs
      - nfs-common
    state: present
  when: ansible_os_family == 'Debian'

- name: Import sssd.conf
  ansible.builtin.copy:
    src: files/sssd.conf
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: '0600'

- name: Ensure autofs is started and enabled
  ansible.builtin.systemd:
    name: autofs
    state: started
    enabled: true

- name: Restart sssd
  ansible.builtin.service:
    name: sssd
    state: restarted

- name: Restart autofs
  ansible.builtin.service:
    name: autofs
    state: restarted
